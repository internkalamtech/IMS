name: PR Build Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Wait for Postgres service
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && echo "Postgres ready" && exit 0
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres not reachable after timeout"
          exit 1
          
      - name: Run tests
        run: pytest tests/
        
      - name: Lint
        run: |
          pip install flake8
          flake8 app/

  mobile-build:
    name: Mobile Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Lint
        run: npm run lint
        
      - name: Type check
        run: npx tsc --noEmit
