name: PR Build Pipeline

on:
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      
      - name: Clear Python cache
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          rm -rf .pytest_cache 2>/dev/null || true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'
          
      - name: Install dependencies
        run: |
          pip cache purge
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run tests
        run: pytest tests/

      - name: Debug checkout and lint context
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          python --version
          python -m flake8 --version
          echo "--- app/__init__.py (lines 1-12) ---"
          nl -ba app/__init__.py | sed -n '1,12p'
          echo "--- app/api/v1/router.py (lines 1-25) ---"
          nl -ba app/api/v1/router.py | sed -n '1,25p'
        
      - name: Lint
        run: |
          echo "Linting commit: ${GITHUB_SHA}"
          git rev-parse HEAD
          pip install flake8
          flake8 app/

  mobile-build:
    name: Mobile Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Lint
        run: npm run lint
        
      - name: Type check
        run: npx tsc --noEmit
